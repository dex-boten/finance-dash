<title>הפיננסים שלי</title>

@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--card:#1a1f2e;--card2:#212638;--border:#2a3050;
  --green:#00c875;--red:#e44258;--yellow:#ffcb00;--blue:#579bfc;--purple:#9d50dd;
  --text:#e8eaf0;--muted:#7b8099;
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
/* LOCK */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:999}
.l-logo{font-size:52px}
.l-title{font-size:26px;font-weight:800}
.l-sub{font-size:13px;color:var(--muted)}
.l-form{display:flex;flex-direction:column;gap:10px;width:260px}
.l-input{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:16px;color:var(--text);font-family:'Heebo',sans-serif;text-align:center;letter-spacing:2px;outline:none}
.l-input:focus{border-color:var(--blue)}
.l-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:'Heebo',sans-serif;cursor:pointer}
.l-err{color:var(--red);font-size:13px;text-align:center;min-height:16px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .35s}
/* APP */
#app{display:none}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.top-title{font-size:18px;font-weight:800}
.lock-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Heebo',sans-serif}
/* MONTH PILLS */
.months-wrap{padding:12px 16px;overflow-x:auto;white-space:nowrap;background:var(--card);border-bottom:1px solid var(--border)}
.month-pill{display:inline-block;padding:7px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-left:6px;transition:.15s}
.month-pill:last-child{margin-left:0}
.month-pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* TABS */
.tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);font-family:'Heebo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:70px}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tc{display:none;padding:16px;max-width:900px;margin:0 auto}
.tc.active{display:block}
/* CARDS */
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
.card-t{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card-v{font-size:28px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.b-red{background:rgba(228,66,88,.15);color:var(--red);border:1px solid rgba(228,66,88,.3)}
.b-yel{background:rgba(255,203,0,.12);color:var(--yellow);border:1px solid rgba(255,203,0,.25)}
.b-grn{background:rgba(0,200,117,.12);color:var(--green);border:1px solid rgba(0,200,117,.25)}
.b-blu{background:rgba(87,155,252,.12);color:var(--blue);border:1px solid rgba(87,155,252,.25)}
/* PROGRESS */
.pbar{background:var(--border);border-radius:8px;height:8px;overflow:hidden;margin:6px 0}
.pfill{height:100%;border-radius:8px;transition:.4s}
/* EXPENSE ROWS */
.grp{margin-bottom:16px}
.grp-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card2);border-radius:10px;cursor:pointer;font-weight:700}
.grp-body{padding-top:4px}
.erow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:8px}
.erow:hover{background:var(--card2)}
.el{display:flex;align-items:center;gap:10px}
.eicon{width:30px;height:30px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ename{font-size:14px;font-weight:500}
.esub{font-size:11px;color:var(--muted);margin-top:1px}
.er{display:flex;align-items:center;gap:8px}
.eamt{font-size:14px;font-weight:700;min-width:65px;text-align:left}
.dim{opacity:.4}
/* CARD BADGES for transactions */
.cb-fly{background:#1e3a5f;color:#579bfc;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.cb-htz{background:#2d1b4e;color:#9d50dd;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.cb-max{background:#1a3d2e;color:#00c875;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
/* FILTER BAR */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fb{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:'Heebo',sans-serif}
.fb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
select.fb{appearance:none;padding-right:14px}
/* TRANSACTION LIST */
.txn-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.txn-row:last-child{border-bottom:none}
.txn-left{display:flex;align-items:center;gap:10px}
.txn-date{font-size:11px;color:var(--muted);min-width:42px}
.txn-name{font-size:14px;font-weight:500}
.txn-cat{font-size:11px;color:var(--muted);margin-top:1px}
.txn-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.txn-amt{font-size:14px;font-weight:700;min-width:75px;text-align:left}
.txn-total{display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid var(--border);margin-top:8px;font-weight:700}
/* REC CARDS */
.rec{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid;position:relative;transition:.2s}
.rec.done{opacity:.35}
.rec.done .rec-t{text-decoration:line-through}
.r-red{background:rgba(228,66,88,.07);border-color:rgba(228,66,88,.3)}
.r-yel{background:rgba(255,203,0,.07);border-color:rgba(255,203,0,.25)}
.r-blu{background:rgba(87,155,252,.07);border-color:rgba(87,155,252,.25)}
.r-grn{background:rgba(0,200,117,.07);border-color:rgba(0,200,117,.25)}
.rec-t{font-size:15px;font-weight:700;margin-bottom:6px}
.rec-b{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.rec-acts{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;font-family:'Heebo',sans-serif;cursor:pointer;border:none}
.rb-done{background:rgba(0,200,117,.15);color:var(--green);border:1px solid rgba(0,200,117,.3)}
.rb-undo{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.rb-keep{background:rgba(87,155,252,.12);color:var(--blue);border:1px solid rgba(87,155,252,.3)}
.done-ck{position:absolute;top:14px;left:14px;font-size:16px}
/* INCOME ROW */
.irow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.irow:last-child{border-bottom:none}
.iamt{font-size:17px;font-weight:800;color:var(--green)}
/* CHART */
.ch-wrap{position:relative;height:180px;margin-top:12px}
/* FOOTER */
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:11px;line-height:1.8}
/* SUMMARY CHANGE */
.chg-up{color:var(--red)}
.chg-dn{color:var(--green)}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
</style>
</head>

  if(document.getElementById('pw').value===PASS){
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    initApp();
  } else {

    const f=document.getElementById('lf');

}

function showTab(i,btn){
  document.querySelectorAll('.tc').forEach((t,j)=>t.classList.toggle('active',j===i));

  if(i===0)renderSummary();
  if(i===3)renderTxns();
}

function renderMonths(){
  const w=document.getElementById('months-wrap');
  w.innerHTML=MONTHS.map(m=>`<span class="month-pill${m.id===selMonth?' active':''}" onclick="selectMonth('${m.id}')">${m.l}</span>`).join('');
}
function selectMonth(id){
  selMonth=id;renderMonths();
  const activeTab=document.querySelector('.tab.active');
  if(activeTab){
    const idx=[...document.querySelectorAll('.tab')].indexOf(activeTab);
    if(idx===0)renderSummary();
    if(idx===3)renderTxns();
  }
}

// ── SUMMARY ───────────────────────────────────────────────────
function renderSummary(){
  const m=MONTHS.find(x=>x.id===selMonth);
  const prev=m.prev?MONTHS.find(x=>x.id===m.prev):null;
  const chg=prev?Math.round((m.total-prev.total)/prev.total*100):null;
  const chgHtml=chg!=null?`<span class="${chg>0?'chg-up':'chg-dn'}">${chg>0?'▲':'▼'} ${Math.abs(chg)}% ממחודש קודם</span>`:'';
  const cards=[{l:'FlyCard',v:m.fly,c:'#579bfc'},{l:'HiTechZone',v:m.htz,c:'#9d50dd'},{l:'Max',v:m.max,c:'#00c875'}].filter(c=>c.v>0);
  const cardBars=cards.map(c=>{
    const pct=Math.round(c.v/m.total*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${c.l}</span><span style="font-weight:700">${c.v.toLocaleString('he-IL')} ₪ (${pct}%)</span></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%;background:${c.c}"></div></div>
    </div>`;
  }).join('');

  // Category donut from transactions of this month
  const cats={};
  TXNS.filter(t=>t.m===selMonth&&t.amt>0).forEach(t=>{cats[t.cat]=(cats[t.cat]||0)+t.amt});
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const catColors=['#579bfc','#00c875','#ffcb00','#e44258','#9d50dd','#7b8099'];

  document.getElementById('tc0').innerHTML=`
  <div class="g2">
    <div class="card">
      <div class="card-t">סה"כ הוצאות CC</div>
      <div class="card-v" style="color:var(--red)">${m.total.toLocaleString('he-IL')} ₪</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">${m.l} ${chgHtml}</div>
    </div>
    <div class="card">
      <div class="card-t">הכנסה חודשית</div>
      <div class="card-v" style="color:var(--green)">23,213 ₪</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">משכורת + השתתפות שכירות</div>
    </div>
  </div>
  <div class="card">
    <div class="card-t" style="margin-bottom:12px">פילוח לפי כרטיס</div>
    ${cardBars}
  </div>
  <div class="card">
    <div class="card-t" style="margin-bottom:8px">קטגוריות מובילות</div>
    <div class="ch-wrap"><canvas id="cat-chart"></canvas></div>
    <div style="margin-top:10px">
      ${topCats.map((c,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0">
        <span><span style="color:${catColors[i]};margin-left:6px">●</span>${c[0]}</span>
        <span style="font-weight:600">${Math.round(c[1]).toLocaleString('he-IL')} ₪</span>
      </div>`).join('')}
    </div>
  </div>`;

  if(chartInst){chartInst.destroy();chartInst=null;}
  const ctx=document.getElementById('cat-chart');
  if(ctx&&topCats.length){
    chartInst=new Chart(ctx,{
      type:'doughnut',
      data:{labels:topCats.map(c=>c[0]),datasets:[{data:topCats.map(c=>Math.round(c[1])),backgroundColor:catColors,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw.toLocaleString('he-IL')} ₪`}}}}
    });
  }
}

function grp(icon,label,total,items){
  const id='g'+Math.random().toString(36).slice(2);
  const rows=items.map(it=>`
  <div class="erow ${it.dim?'dim':''}">
    <div class="el"><div class="eicon">${it.icon||'•'}</div>
      <div><div class="ename">${it.name}</div>${it.sub?`<div class="esub">${it.sub}</div>`:''}</div>
    </div>
    <div class="er">${it.badge||''}<div class="eamt ${it.red?'style="color:var(--red)"':''}">${it.amt}</div></div>
  </div>`).join('');
  return `<div class="grp">
    <div class="grp-hdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
      <span>${icon} ${label}</span><span style="color:var(--muted);font-size:13px">${total}</span>
    </div>
    <div class="grp-body" id="${id}">${rows}</div>
  </div>`;
}

      {icon:'📊',name:'פנסיה עובד',sub:'מור פנסיה (מהתלוש)',amt:'2,313 ₪'},
      {icon:'📊',name:'פנסיה מעסיק',sub:'לא יוצא ממך',amt:'5,924 ₪',dim:true},
    ]);
}

// ── TRANSACTIONS ──────────────────────────────────────────────
let txnCard='all', txnCat='all';
function renderTxns(){
  const m=MONTHS.find(x=>x.id===selMonth);
  let rows=TXNS.filter(t=>t.m===selMonth);
  const cats=[...new Set(rows.map(t=>t.cat))].sort();
  if(txnCard!=='all') rows=rows.filter(t=>t.card===txnCard);
  if(txnCat!=='all') rows=rows.filter(t=>t.cat===txnCat);
  rows=[...rows].sort((a,b)=>b.d.localeCompare(a.d));
  const total=rows.reduce((s,t)=>s+t.amt,0);

  const catOpts=cats.map(c=>`<option value="${c}"${txnCat===c?' selected':''}>${c}</option>`).join('');
  const cardBtns=['all','FlyCard','HiTechZone','Max'].map(c=>
    `<button class="fb${txnCard===c?' on':''}" onclick="txnCard='${c}';renderTxns()">${c==='all'?'כל הכרטיסים':c}</button>`
  ).join('');

  const list=rows.length?rows.map(t=>{
    const badge=t.card==='FlyCard'?'<span class="cb-fly">FlyCard</span>':t.card==='HiTechZone'?'<span class="cb-htz">HiTechZone</span>':'<span class="cb-max">Max</span>';
    const col=t.amt<0?'color:var(--green)':'';
    return `<div class="txn-row">
      <div class="txn-left">
        <div class="txn-date">${t.d}</div>
        <div><div class="txn-name">${t.name}</div><div class="txn-cat">${t.cat}</div></div>
      </div>
      <div class="txn-right">${badge}<div class="txn-amt" style="${col}">${t.amt<0?'':''} ${t.amt.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2})} ₪</div></div>
    </div>`;
  }).join(''):`<div style="padding:30px;text-align:center;color:var(--muted)">אין עסקאות לבחירה זו</div>`;

  document.getElementById('tc3').innerHTML=`
  <div class="filter-bar">
    ${cardBtns}
    <select class="fb" onchange="txnCat=this.value;renderTxns()">
      <option value="all"${txnCat==='all'?' selected':''}>כל הקטגוריות</option>
      ${catOpts}
    </select>
  </div>
  <div class="card" style="padding:0 16px">
    ${list}
    ${rows.length?`<div class="txn-total"><span>${rows.length} עסקאות</span><span>${total.toLocaleString('he-IL',{minimumFractionDigits:2})} ₪</span></div>`:''}
  </div>`;
}

// ── RECOMMENDATIONS ───────────────────────────────────────────
function renderRecs(){
  const st=gs();
  const tmap={red:'r-red',yellow:'r-yel',blue:'r-blu',green:'r-grn'};
  document.getElementById('tc4').innerHTML=RECS.map(r=>{
    const done=st['r-'+r.id]==='done';
    const btns=r.btns.map(b=>`<button class="rbtn ${b.a==='done'?'rb-done':'rb-keep'}" onclick="recAct('${r.id}','${b.a}')">${b.l}</button>`).join('');
    const undo=done?`<button class="rbtn rb-undo" onclick="recAct('${r.id}','undo')">↩ בטל</button>`:'';
    return `<div class="rec ${tmap[r.type]} ${done?'done':''}" id="rc-${r.id}">
      ${done?'<div class="done-ck">✅</div>':''}
      <div class="rec-t">${r.t}</div>
      <div class="rec-b">${r.b}</div>
      <div class="rec-acts">${btns}${undo}</div>
    </div>`;
  }).join('');
}
function recAct(id,a){
  ss('r-'+id,a==='undo'?'':a);renderRecs();
}

// ── INIT ──────────────────────────────────────────────────────
function initApp(){
  renderMonths();
  renderSummary();
  renderIncome();
  renderFixed();
  renderRecs();
}
</script>

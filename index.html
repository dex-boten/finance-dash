<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>💰 הפיננסים של שקד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--card:#1a1f2e;--card2:#212638;--border:#2a3050;
  --green:#00c875;--red:#e44258;--yellow:#ffcb00;--blue:#579bfc;--purple:#9d50dd;
  --text:#e8eaf0;--muted:#7b8099;--text2:#a8b0c8;
}
html{scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}

/* ═══ LOCK ═══ */
#lock{position:fixed;inset:0;background:radial-gradient(ellipse at 60% 40%,#141929 0%,#0f1117 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:1000}
.l-glow{position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(87,155,252,.12) 0%,transparent 70%);pointer-events:none}
.l-logo{font-size:60px;line-height:1;filter:drop-shadow(0 0 24px rgba(87,155,252,.5));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.l-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.l-sub{font-size:13px;color:var(--muted);margin-top:-6px}
.l-form{display:flex;flex-direction:column;gap:10px;width:290px;margin-top:10px}
.l-input{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:15px 20px;font-size:20px;color:var(--text);font-family:'Heebo',sans-serif;text-align:center;letter-spacing:5px;outline:none;transition:.2s;width:100%}
.l-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(87,155,252,.1)}
.l-btn{background:linear-gradient(135deg,var(--blue),#7b5cfc);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;font-family:'Heebo',sans-serif;cursor:pointer;transition:.2s;letter-spacing:.3px}
.l-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(87,155,252,.4)}
.l-btn:active{transform:translateY(0)}
.l-err{color:var(--red);font-size:12px;text-align:center;min-height:18px;font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(10px)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}75%{transform:translateX(-4px)}90%{transform:translateX(4px)}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}

/* ═══ APP ═══ */
#app{display:none}

/* ═══ TOP BAR ═══ */
.topbar{background:rgba(26,31,46,.95);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;backdrop-filter:blur(16px)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px}
.topbar-title{font-size:16px;font-weight:800;color:var(--text)}
.topbar-badge{background:rgba(87,155,252,.15);border:1px solid rgba(87,155,252,.25);color:var(--blue);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700}
.lock-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Heebo',sans-serif;transition:.15s;white-space:nowrap}
.lock-btn:hover{border-color:var(--red);color:var(--red)}

/* ═══ MONTHS ═══ */
.months-bar{padding:9px 16px;overflow-x:auto;white-space:nowrap;background:var(--card);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.months-bar::-webkit-scrollbar{height:2px}
.months-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mpill{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;margin-left:6px;transition:.15s;font-family:'Heebo',sans-serif;white-space:nowrap}
.mpill:last-child{margin-left:0}
.mpill:hover{border-color:var(--blue);color:var(--blue)}
.mpill.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 14px rgba(87,155,252,.35)}

/* ═══ TABS ═══ */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:57px;z-index:100;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tbtn{flex:1;padding:11px 6px;border:none;background:transparent;color:var(--muted);font-family:'Heebo',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;min-width:62px;transition:.15s;letter-spacing:.1px}
.tbtn:hover{color:var(--text2)}
.tbtn.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ═══ TAB PAGES ═══ */
.tpage{display:none;padding:16px;max-width:980px;margin:0 auto;padding-bottom:48px}
.tpage.active{display:block}

/* ═══ CARDS ═══ */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.clabel{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.cval{font-size:26px;font-weight:800;line-height:1.1}
.csub{font-size:12px;color:var(--muted);margin-top:4px}

/* ═══ HERO ═══ */
.hero{background:linear-gradient(145deg,#1a1f2e 0%,#1c2240 100%);border:1px solid rgba(87,155,252,.2);border-radius:20px;padding:32px 24px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(87,155,252,.08) 0%,transparent 70%);pointer-events:none}
.hero-lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.hero-amt{font-size:58px;font-weight:900;line-height:1;letter-spacing:-2px;transition:color .3s}
.hero-amt.pos{color:var(--green);text-shadow:0 0 40px rgba(0,200,117,.2)}
.hero-amt.neg{color:var(--red);text-shadow:0 0 40px rgba(228,66,88,.2)}
.hero-sub{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}

/* ═══ GRIDS ═══ */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
@media(max-width:460px){.g3{grid-template-columns:1fr 1fr}}

/* ═══ PACE BAR ═══ */
.pace{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.pace-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pace-title{font-size:13px;font-weight:800}
.pace-day{font-size:12px;color:var(--muted)}
.pace-track{position:relative;height:14px;background:var(--card2);border-radius:14px;overflow:hidden;direction:ltr}
.pace-fill{height:100%;border-radius:14px;transition:width .8s cubic-bezier(.22,1,.36,1);position:relative}
.pace-marker{position:absolute;top:0;bottom:0;width:2px;z-index:2;transition:right .8s}
.pace-marker::before{content:attr(data-pct);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--yellow);white-space:nowrap;font-family:'Heebo',sans-serif}
.pace-labels{display:flex;justify-content:space-between;margin-top:7px;font-size:11px}
.pace-insight{margin-top:10px;padding:8px 12px;background:var(--card2);border-radius:10px;font-size:12px;color:var(--text2)}

/* ═══ SECTION TITLE ═══ */
.stitle{font-size:14px;font-weight:800;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* ═══ MOM ROWS ═══ */
.mom-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(42,48,80,.5)}
.mom-row:last-child{border-bottom:none}
.mom-cat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.mom-r{display:flex;align-items:center;gap:8px}
.mom-amt{font-size:13px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800}
.bg{background:rgba(0,200,117,.12);color:var(--green)}
.br{background:rgba(228,66,88,.12);color:var(--red)}
.by{background:rgba(255,203,0,.12);color:var(--yellow)}
.bm{background:rgba(123,128,153,.12);color:var(--muted)}

/* ═══ FORECAST ═══ */
.forecast{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.f-items{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.f-item{flex:1;min-width:100px}
.f-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.f-val{font-size:18px;font-weight:800}

/* ═══ CAT GRID ═══ */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
@media(min-width:600px){.catgrid{grid-template-columns:repeat(3,1fr)}}
.catcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;transition:.15s border-color,.15s box-shadow;position:relative;overflow:hidden}
.catcard:hover{border-color:rgba(87,155,252,.5);box-shadow:0 4px 24px rgba(87,155,252,.08)}
.catcard.open{border-color:var(--blue)}
.ci{font-size:26px;margin-bottom:7px;line-height:1}
.cn{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:2px}
.ca{font-size:20px;font-weight:900;margin-bottom:8px;color:var(--text)}
.cpbar{height:5px;background:var(--card2);border-radius:5px;overflow:hidden;margin-bottom:4px}
.cpfill{height:100%;border-radius:5px;transition:width .6s}
.cplabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.cremain{font-size:11px;font-weight:700;margin-top:5px}
.cremain.ok{color:var(--green)}
.cremain.warn{color:var(--yellow)}
.cremain.over{color:var(--red)}
.cremain.no{color:var(--muted)}
.cexpand{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.cexpand.open{display:block}
.txn{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(42,48,80,.4);gap:6px}
.txn:last-child{border-bottom:none}
.txn-amt{font-size:12px;font-weight:800;color:var(--red);white-space:nowrap;flex-shrink:0}
.txn-name{font-size:11.5px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.txn-date{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.cexpand-hd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* ═══ CHARTS ═══ */
.chartcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.chart-title{font-size:14px;font-weight:800;margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:220px}
@media(min-width:600px){.chart-wrap{height:280px}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;flex:1;min-width:160px}
.chip-lbl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.chip-val{font-size:16px;font-weight:800}
.chip-note{font-size:11px;color:var(--muted);margin-top:2px}

/* ═══ SUBSCRIPTIONS ═══ */
.subrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(42,48,80,.5)}
.subrow:last-child{border-bottom:none}
.subleft{display:flex;align-items:center;gap:12px}
.subicon{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.subname{font-size:14px;font-weight:800}
.submeta{font-size:11px;color:var(--muted);margin-top:2px}
.subright{text-align:left;flex-shrink:0}
.subamt{font-size:17px;font-weight:900;color:var(--text)}
.subfreq{font-size:11px;color:var(--muted)}
.subflag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(255,203,0,.12);color:var(--yellow)}

/* ═══ RECOMMENDATIONS ═══ */
.reccard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;gap:14px;transition:.15s box-shadow}
.reccard:hover{box-shadow:0 6px 24px rgba(0,0,0,.3)}
.recicon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.recbody{flex:1}
.rectitle{font-size:14px;font-weight:900;margin-bottom:5px}
.rectext{font-size:13px;color:var(--text2);line-height:1.55}
.recsave{display:inline-block;margin-top:9px;padding:3px 11px;border-radius:20px;background:rgba(0,200,117,.12);color:var(--green);font-size:12px;font-weight:800}
.recaction{display:inline-block;margin-top:9px;margin-right:8px;padding:6px 14px;border-radius:9px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;font-family:'Heebo',sans-serif;border:none;transition:.15s}
.recaction:hover{background:#4a8ef5}

/* ═══ IMPORT ═══ */
.dropzone{border:2px dashed var(--border);border-radius:18px;padding:44px 24px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:rgba(87,155,252,.04)}
.dz-icon{font-size:52px;margin-bottom:14px}
.dz-title{font-size:16px;font-weight:800;margin-bottom:6px}
.dz-sub{font-size:13px;color:var(--muted);line-height:1.6}
.dz-btn{display:inline-block;margin-top:18px;background:linear-gradient(135deg,var(--blue),#7b5cfc);color:#fff;border:none;border-radius:11px;padding:11px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Heebo',sans-serif;transition:.15s}
.dz-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(87,155,252,.35)}
.bankguide{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px}
.bankguide h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bstep{display:flex;gap:10px;margin-bottom:9px;font-size:13px;color:var(--text2);align-items:flex-start}
.bstep:last-child{margin-bottom:0}
.bnum{width:22px;height:22px;min-width:22px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.statusrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.statusval{font-weight:800;color:var(--green)}

/* ═══ MISC ═══ */
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:14px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ═══ RESPONSIVE ═══ */
@media(max-width:480px){
  .hero-amt{font-size:44px}
  .g3{grid-template-columns:1fr 1fr}
  .tbtn{font-size:11px;padding:10px 5px;min-width:54px}
  .catcard .ca{font-size:17px}
  .reccard{flex-direction:column;gap:10px}
  .recicon{width:38px;height:38px;font-size:18px}
}
</style>
</head>
<body>

<!-- ════════════ LOCK SCREEN ════════════ -->
<div id="lock">
  <div class="l-glow"></div>
  <div class="l-logo">💰</div>
  <div class="l-title">הפיננסים של שקד</div>
  <div class="l-sub">הכנס סיסמה להמשך</div>
  <div class="l-form" id="lform">
    <input type="password" id="pwd" class="l-input" placeholder="••••••••" autocomplete="off"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="l-btn" onclick="tryLogin()">כניסה 🔓</button>
    <div class="l-err" id="lerr"></div>
  </div>
</div>

<!-- ════════════ APP ════════════ -->
<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">💰</span>
      <span class="topbar-title">הפיננסים שלי</span>
      <span class="topbar-badge" id="cur-badge">טוען...</span>
    </div>
    <button class="lock-btn" onclick="lockApp()">🔒 נעל</button>
  </div>

  <!-- Month selector -->
  <div class="months-bar" id="months-bar"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tbtn active" onclick="switchTab('overview',this)">📊 סקירה</button>
    <button class="tbtn" onclick="switchTab('categories',this)">📂 קטגוריות</button>
    <button class="tbtn" onclick="switchTab('trends',this)">📈 טרנדים</button>
    <button class="tbtn" onclick="switchTab('subscriptions',this)">🔁 מנויים</button>
    <button class="tbtn" onclick="switchTab('recommendations',this)">💡 המלצות</button>
    <button class="tbtn" onclick="switchTab('import',this)">⬆️ ייבוא</button>
  </div>

  <!-- Tab pages -->
  <div id="t-overview"       class="tpage active"><div class="loading"><div class="spin"></div><span style="color:var(--muted);font-size:13px">טוען נתונים...</span></div></div>
  <div id="t-categories"     class="tpage"><div class="loading"><div class="spin"></div></div></div>
  <div id="t-trends"         class="tpage"><div class="loading"><div class="spin"></div></div></div>
  <div id="t-subscriptions"  class="tpage"><div class="loading"><div class="spin"></div></div></div>
  <div id="t-recommendations" class="tpage"><div class="loading"><div class="spin"></div></div></div>
  <div id="t-import"         class="tpage"><div class="loading"><div class="spin"></div></div></div>
</div>

<script>
// ══════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════
const INCOME = 17734;
const FIXED  = 7784;
const SAFE   = INCOME - FIXED; // 9950

const MONTH_HE = {'01':'ינואר','02':'פברואר','03':'מרץ','04':'אפריל','05':'מאי','06':'יוני','07':'יולי','08':'אוגוסט','09':'ספטמבר','10':'אוקטובר','11':'נובמבר','12':'דצמבר'};

const CM = {
  restaurants: {i:'🍽️',l:'מסעדות',b:1500,c:'#e44258'},
  grocery:     {i:'🛒',l:'סופר',b:1200,c:'#00c875'},
  transport:   {i:'🚗',l:'תחבורה',b:900,c:'#579bfc'},
  travel:      {i:'✈️',l:'נסיעות',b:3000,c:'#9d50dd'},
  entertainment:{i:'🎭',l:'בידור',b:700,c:'#ffcb00'},
  subscriptions:{i:'📱',l:'מנויים',b:600,c:'#579bfc'},
  health:      {i:'💊',l:'בריאות',b:500,c:'#00c875'},
  fashion:     {i:'👗',l:'אופנה',b:700,c:'#e44258'},
  home:        {i:'🏠',l:'בית',b:600,c:'#9d50dd'},
  insurance:   {i:'🛡️',l:'ביטוח',b:500,c:'#7b8099'},
  tech:        {i:'💻',l:'טכנולוגיה',b:300,c:'#579bfc'},
  other:       {i:'📦',l:'אחר',b:500,c:'#7b8099'},
  energy:      {i:'⚡',l:'חשמל',b:250,c:'#ffcb00'},
  transfers:   {i:'💸',l:'העברות',b:0,c:'#7b8099'},
  institutions:{i:'🏛️',l:'מוסדות',b:400,c:'#7b8099'},
  events:      {i:'🎪',l:'אירועים',b:300,c:'#ffcb00'},
  equipment:   {i:'🔧',l:'ציוד',b:300,c:'#7b8099'},
  hotel:       {i:'🏨',l:'מלון',b:0,c:'#9d50dd'},
  pet:         {i:'🐾',l:'חיות מחמד',b:200,c:'#00c875'},
  kids:        {i:'👶',l:'ילדים',b:200,c:'#ffcb00'},
  education:   {i:'📚',l:'חינוך',b:200,c:'#579bfc'},
  beauty:      {i:'💄',l:'יופי',b:200,c:'#e44258'},
  charity:     {i:'❤️',l:'צדקה',b:100,c:'#e44258'},
};

const CHART_COLORS = ['#e44258','#579bfc','#9d50dd','#00c875','#ffcb00','#fd79a8','#74b9ff','#00cec9','#a29bfe'];

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let txns = [];
let months = [];
let selectedMonth = '';
let activeTab = 'overview';
let charts = {};

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
const ₪ = n => '₪' + Math.abs(Math.round(n)).toLocaleString('he-IL');
const ₪s = n => (n>=0?'+':'-') + '₪' + Math.abs(Math.round(n)).toLocaleString('he-IL');

function mLabel(m) {
  const [y,mo] = m.split('-');
  return MONTH_HE[mo] + (y !== '2026' ? ' \'' + y.slice(2) : '');
}
function daysInMonth(m) {
  const [y,mo] = m.split('-').map(Number);
  return new Date(y, mo, 0).getDate();
}
function todayDay() { return new Date().getDate(); }
function getMonthTxns(m) { return txns.filter(t => t.month === m); }
function sumT(arr) { return arr.reduce((s,t) => s + t.amount, 0); }
function byCat(arr) {
  const map = {};
  for (const t of arr) { (map[t.cat] = map[t.cat] || []).push(t); }
  return map;
}
function killChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}
function chartDefaults() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b8099', font: { family: 'Heebo', size: 11 } } },
      y: { grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b8099', font: { family: 'Heebo', size: 11 }, callback: v => '₪' + v.toLocaleString('he-IL') }, beginAtZero: true },
    }
  };
}

// ══════════════════════════════════════════════════
// LOCK
// ══════════════════════════════════════════════════
function tryLogin() {
  const v = document.getElementById('pwd').value;
  if (v === 'Shaked2026') {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    const f = document.getElementById('lform');
    const e = document.getElementById('lerr');
    e.textContent = '❌ סיסמה שגויה — נסה שוב';
    f.classList.remove('shake');
    void f.offsetWidth;
    f.classList.add('shake');
    setTimeout(() => { e.textContent = ''; }, 2500);
  }
}
function lockApp() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('pwd').value = '';
}

// ══════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch('./data.json');
    const data = await res.json();
    txns = data.transactions;
    months = [...new Set(txns.map(t => t.month))].sort();
    selectedMonth = months[months.length - 1];
    boot();
  } catch(e) {
    console.error(e);
    document.getElementById('t-overview').innerHTML = '<div class="empty">❌ שגיאה בטעינת הנתונים.<br>ודא ש-data.json נמצא באותה תיקייה.</div>';
  }
}

function boot() {
  buildMonthPills();
  updateBadge();
  renderTab();
}

// ══════════════════════════════════════════════════
// MONTH PILLS
// ══════════════════════════════════════════════════
function buildMonthPills() {
  const bar = document.getElementById('months-bar');
  bar.innerHTML = months.map(m =>
    `<button class="mpill${m===selectedMonth?' active':''}" onclick="selMonth('${m}')">${mLabel(m)}</button>`
  ).join('');
}
function selMonth(m) {
  selectedMonth = m;
  document.querySelectorAll('.mpill').forEach(el => el.classList.toggle('active', el.textContent===mLabel(m)));
  updateBadge();
  renderTab();
}
function updateBadge() {
  document.getElementById('cur-badge').textContent = mLabel(selectedMonth);
}

// ══════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════
function switchTab(name, btn) {
  activeTab = name;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tpage').forEach(el => el.classList.remove('active'));
  document.getElementById('t-'+name).classList.add('active');
  renderTab();
}
function renderTab() {
  ({overview:rOverview, categories:rCategories, trends:rTrends, subscriptions:rSubscriptions, recommendations:rRec, import:rImport})[activeTab]?.();
}

// ══════════════════════════════════════════════════
// TAB 1 — OVERVIEW
// ══════════════════════════════════════════════════
function rOverview() {
  const el = document.getElementById('t-overview');
  const mt = getMonthTxns(selectedMonth);
  const spent = sumT(mt);
  const remaining = SAFE - spent;
  const isCurrent = selectedMonth === months[months.length - 1];

  const dim = daysInMonth(selectedMonth);
  const dayElapsed = isCurrent ? todayDay() : dim;
  const pctM = dayElapsed / dim;
  const pctB = Math.min(1, spent / SAFE);

  // Pace bar color
  let paceColor = 'var(--green)';
  if (pctB > pctM * 1.3) paceColor = 'var(--red)';
  else if (pctB > pctM * 1.1) paceColor = 'var(--yellow)';

  // Forecast
  const dailyRate = dayElapsed > 0 ? spent / dayElapsed : 0;
  const projected = dailyRate * dim;
  const projRemain = SAFE - projected;

  // Pace insight
  let paceText = '';
  if (isCurrent) {
    if (pctB < pctM * 0.6) paceText = '✅ מדהים! קצב הוצאות נמוך בהרבה מהצפי.';
    else if (pctB < pctM * 0.9) paceText = '👍 קצב טוב — תמשיך כך!';
    else if (pctB < pctM * 1.1) paceText = '👌 קצב תקין — בגבולות התקציב.';
    else if (pctB < pctM * 1.3) paceText = '⚠️ קצב מעט גבוה — שים לב לשארית החודש.';
    else paceText = '🚨 קצב גבוה משמעותית — מומלץ לצמצם.';
  } else {
    paceText = `חודש שהסתיים — סה"כ ${₪(spent)} הוצאות (${Math.round(pctB*100)}% מהתקציב)`;
  }

  // MoM comparison
  const mi = months.indexOf(selectedMonth);
  const prevM = mi > 0 ? months[mi - 1] : null;
  const prevT = prevM ? getMonthTxns(prevM) : [];
  const prevCats = byCat(prevT);
  const curCats = byCat(mt);

  const allCats = [...new Set([...Object.keys(curCats), ...Object.keys(prevCats)])];
  const momItems = allCats
    .map(cat => ({cat, cur: sumT(curCats[cat]||[]), prev: sumT(prevCats[cat]||[])}))
    .filter(x => x.cur > 0)
    .sort((a,b) => b.cur - a.cur);

  const momHTML = prevM
    ? momItems.map(({cat,cur,prev}) => {
        const m = CM[cat] || {i:'📦',l:cat};
        const chg = prev > 0 ? (cur-prev)/prev*100 : null;
        const up = chg !== null ? cur > prev : false;
        const cls = chg === null ? 'bm' : (up ? 'br' : 'bg');
        const lbl = chg === null ? 'חדש' : (Math.abs(Math.round(chg)) + '%');
        const arr = chg === null ? '' : (up ? '↑' : '↓');
        return `<div class="mom-row">
          <div class="mom-cat">${m.i} ${m.l}</div>
          <div class="mom-r">
            <span class="mom-amt">${₪(cur)}</span>
            <span class="badge ${cls}">${arr}${lbl}</span>
          </div>
        </div>`;
      }).join('') || '<div class="empty">אין הוצאות בחודש זה</div>'
    : '<div class="empty">אין חודש קודם</div>';

  el.innerHTML = `
    <!-- HERO -->
    <div class="hero">
      <div class="hero-lbl">${isCurrent ? 'בטוח להוציא החודש' : 'עודף / גירעון סופי'}</div>
      <div class="hero-amt ${remaining>=0?'pos':'neg'}">${remaining>=0?'+':''}${₪(remaining)}</div>
      <div class="hero-sub">
        הכנסה ${₪(INCOME)} &nbsp;•&nbsp; הוצאות קבועות ${₪(FIXED)}<br>
        ${isCurrent ? `הוצאת עד כה ${₪(spent)} מתוך ${₪(SAFE)} תקציב גמיש` : `סה"כ הוצאות גמישות: ${₪(spent)}`}
      </div>
    </div>

    <!-- PACE BAR -->
    ${isCurrent ? `
    <div class="pace">
      <div class="pace-hd">
        <span class="pace-title">⏱️ קצב הוצאות</span>
        <span class="pace-day">יום ${dayElapsed} מתוך ${dim}</span>
      </div>
      <div class="pace-track">
        <div class="pace-fill" style="width:${Math.round(pctB*100)}%;background:${paceColor}"></div>
        <div class="pace-marker" style="right:${100-Math.round(pctM*100)}%;background:rgba(255,203,0,.4);width:2px;position:absolute;top:0;bottom:0" data-pct="${Math.round(pctM*100)}%"></div>
      </div>
      <div class="pace-labels">
        <span style="font-weight:800;color:${paceColor}">${Math.round(pctB*100)}% מהתקציב</span>
        <span style="color:var(--yellow)">${Math.round(pctM*100)}% מהחודש עבר</span>
      </div>
      <div class="pace-insight">${paceText}</div>
    </div>
    ` : `<div class="pace"><div class="pace-insight">${paceText}</div></div>`}

    <!-- 3 SUMMARY CARDS -->
    <div class="g3">
      <div class="card" style="margin:0;text-align:center">
        <div class="clabel">💵 הכנסה</div>
        <div class="cval" style="font-size:21px;color:var(--green)">${₪(INCOME)}</div>
        <div class="csub">+ ${₪(FIXED)} קבוע</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div class="clabel">💸 הוצאות</div>
        <div class="cval" style="font-size:21px;color:var(--red)">${₪(spent)}</div>
        <div class="csub">גמישות החודש</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div class="clabel">${remaining>=0?'✅ נשאר':'❌ גירעון'}</div>
        <div class="cval" style="font-size:21px;color:${remaining>=0?'var(--green)':'var(--red)'}">
          ${remaining>=0?'+':''}${₪(remaining)}
        </div>
        <div class="csub">מ-${₪(SAFE)} תקציב</div>
      </div>
    </div>

    <!-- FORECAST -->
    ${isCurrent ? `
    <div class="forecast">
      <div class="stitle" style="margin-bottom:8px">📡 תחזית לסוף החודש</div>
      <div class="f-items">
        <div class="f-item">
          <div class="f-lbl">צפי הוצאות</div>
          <div class="f-val" style="color:${projected>SAFE?'var(--red)':'var(--text)'}">${₪(projected)}</div>
        </div>
        <div class="f-item">
          <div class="f-lbl">צפי עודף/גירעון</div>
          <div class="f-val" style="color:${projRemain>=0?'var(--green)':'var(--red)'}">
            ${projRemain>=0?'+':''}${₪(projRemain)}
          </div>
        </div>
        <div class="f-item">
          <div class="f-lbl">ממוצע יומי</div>
          <div class="f-val">${dayElapsed>0?₪(dailyRate):'-'}<span style="font-size:12px;font-weight:400;color:var(--muted)">/יום</span></div>
        </div>
        <div class="f-item">
          <div class="f-lbl">ימים שנותרו</div>
          <div class="f-val">${dim - dayElapsed}</div>
        </div>
      </div>
    </div>
    ` : ''}

    <!-- MOM COMPARISON -->
    ${prevM ? `
    <div class="stitle">📊 לעומת ${mLabel(prevM)}</div>
    <div class="card">${momHTML}</div>
    ` : ''}
  `;
}

// ══════════════════════════════════════════════════
// TAB 2 — CATEGORIES
// ══════════════════════════════════════════════════
function rCategories() {
  const el = document.getElementById('t-categories');
  const mt = getMonthTxns(selectedMonth);
  const cats = byCat(mt);

  const entries = Object.entries(cats)
    .map(([cat, list]) => ({
      cat,
      m: CM[cat] || {i:'📦',l:cat,b:0,c:'#7b8099'},
      list: list.sort((a,b) => b.amount - a.amount),
      total: sumT(list),
    }))
    .sort((a,b) => b.total - a.total);

  if (!entries.length) {
    el.innerHTML = '<div class="empty">אין הוצאות בחודש זה 🎉</div>';
    return;
  }

  const totalSpent = entries.reduce((s,c) => s+c.total, 0);

  el.innerHTML = `
    <div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="clabel">סה"כ הוצאות</div>
        <div class="cval" style="color:var(--red)">${₪(totalSpent)}</div>
      </div>
      <div style="text-align:left">
        <div class="clabel">קטגוריות</div>
        <div class="cval">${entries.length}</div>
      </div>
      <div style="text-align:left">
        <div class="clabel">עסקאות</div>
        <div class="cval">${getMonthTxns(selectedMonth).length}</div>
      </div>
    </div>
    <div class="catgrid">
      ${entries.map(({cat,m,list,total}) => {
        const pct = m.b > 0 ? Math.min(100, total/m.b*100) : 0;
        const rem = m.b - total;
        const bColor = rem < 0 ? 'var(--red)' : pct > 80 ? 'var(--yellow)' : 'var(--green)';
        const rCls = rem < 0 ? 'over' : pct > 80 ? 'warn' : m.b > 0 ? 'ok' : 'no';
        const rTxt = m.b <= 0 ? 'ללא תקציב' : rem >= 0 ? `נשאר: ${₪(rem)}` : `חריגה: ${₪(-rem)}`;
        const txHTML = list.slice(0, 15).map(t =>
          `<div class="txn">
            <span class="txn-amt">${₪(t.amount)}</span>
            <span class="txn-name" title="${t.name}">${t.name}</span>
            <span class="txn-date">${t.date.slice(5)}</span>
          </div>`
        ).join('') + (list.length > 15 ? `<div style="font-size:10px;color:var(--muted);padding:6px 0;text-align:center">+ עוד ${list.length-15} עסקאות</div>` : '');
        return `
          <div class="catcard" id="cc-${cat}" onclick="toggleCat('${cat}')">
            <div class="ci">${m.i}</div>
            <div class="cn">${m.l}</div>
            <div class="ca">${₪(total)}</div>
            ${m.b > 0 ? `
            <div class="cpbar"><div class="cpfill" style="width:${pct.toFixed(1)}%;background:${bColor}"></div></div>
            <div class="cplabels"><span style="color:${bColor}">${Math.round(pct)}%</span><span>${₪(m.b)}</span></div>
            ` : ''}
            <div class="cremain ${rCls}">${rTxt}</div>
            <div class="cexpand" id="cx-${cat}">
              <div class="cexpand-hd">${list.length} עסקאות</div>
              ${txHTML}
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
}

function toggleCat(cat) {
  const cx = document.getElementById('cx-'+cat);
  const cc = document.getElementById('cc-'+cat);
  if (!cx) return;
  const open = cx.classList.toggle('open');
  cc.classList.toggle('open', open);
}

// ══════════════════════════════════════════════════
// TAB 3 — TRENDS
// ══════════════════════════════════════════════════
function rTrends() {
  const el = document.getElementById('t-trends');

  // Monthly totals
  const mTotals = months.map(m => ({ m, lbl: mLabel(m), total: sumT(getMonthTxns(m)) }));

  // Top 5 cats overall
  const catTot = {};
  txns.forEach(t => { catTot[t.cat] = (catTot[t.cat]||0) + t.amount; });
  const top5 = Object.entries(catTot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c])=>c);

  // Last 6 months
  const last6 = months.slice(-6);

  // Insights
  const maxM = mTotals.reduce((mx,x) => x.total>mx.total?x:mx, mTotals[0]);
  const avgM = mTotals.reduce((s,m)=>s+m.total,0) / mTotals.length;

  // Fastest growing cat (last 2 full months, excluding current partial)
  const fullMonths = months.filter(m => m !== months[months.length-1]);
  let fastCat = null;
  if (fullMonths.length >= 2) {
    const lm = fullMonths[fullMonths.length-1];
    const pm = fullMonths[fullMonths.length-2];
    const lc = byCat(getMonthTxns(lm));
    const pc = byCat(getMonthTxns(pm));
    let best = 0;
    for (const c of Object.keys(lc)) {
      const cur = sumT(lc[c]||[]);
      const prev = sumT(pc[c]||[]);
      if (prev > 50) {
        const g = (cur-prev)/prev;
        if (g > best) { best = g; fastCat = c; }
      }
    }
  }

  el.innerHTML = `
    <div class="chartcard">
      <div class="chart-title">📈 הוצאות חודשיות</div>
      <div class="chart-sub">סך הוצאות לפי חודש (לא כולל הוצאות קבועות)</div>
      <div class="chart-wrap"><canvas id="ch-monthly"></canvas></div>
    </div>
    <div class="chartcard">
      <div class="chart-title">📊 Top 5 קטגוריות — 6 חודשים אחרונים</div>
      <div class="chart-sub">מצטבר לפי קטגוריה</div>
      <div class="chart-wrap"><canvas id="ch-cats"></canvas></div>
    </div>
    <div class="chips">
      <div class="chip">
        <div class="chip-lbl">📅 החודש היקר ביותר</div>
        <div class="chip-val">${maxM.lbl}</div>
        <div class="chip-note">${₪(maxM.total)}</div>
      </div>
      <div class="chip">
        <div class="chip-lbl">📊 ממוצע חודשי</div>
        <div class="chip-val">${₪(avgM)}</div>
        <div class="chip-note">מ-${mTotals.length} חודשים</div>
      </div>
      ${fastCat ? `<div class="chip">
        <div class="chip-lbl">📈 גדלה הכי מהר</div>
        <div class="chip-val">${CM[fastCat]?.i||''} ${CM[fastCat]?.l||fastCat}</div>
        <div class="chip-note">לעומת חודש קודם</div>
      </div>` : ''}
      <div class="chip">
        <div class="chip-lbl">🏆 הקטגוריה הגדולה ביותר</div>
        <div class="chip-val">${CM[top5[0]]?.i||''} ${CM[top5[0]]?.l||top5[0]}</div>
        <div class="chip-note">${₪(catTot[top5[0]])} סה"כ</div>
      </div>
    </div>
  `;

  // Line chart
  killChart('monthly');
  const c1 = document.getElementById('ch-monthly').getContext('2d');
  const gradient = c1.createLinearGradient(0, 0, 0, 280);
  gradient.addColorStop(0, 'rgba(87,155,252,.25)');
  gradient.addColorStop(1, 'rgba(87,155,252,.0)');
  charts['monthly'] = new Chart(c1, {
    type: 'line',
    data: {
      labels: mTotals.map(m=>m.lbl),
      datasets: [{
        label: 'הוצאות',
        data: mTotals.map(m=>m.total),
        borderColor: '#579bfc',
        backgroundColor: gradient,
        fill: true,
        tension: 0.4,
        pointBackgroundColor: '#579bfc',
        pointBorderColor: '#0f1117',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 8,
      }]
    },
    options: {
      ...chartDefaults(),
      plugins: {
        ...chartDefaults().plugins,
        tooltip: {
          backgroundColor: '#1a1f2e',
          borderColor: '#2a3050',
          borderWidth: 1,
          titleColor: '#e8eaf0',
          bodyColor: '#a8b0c8',
          callbacks: { label: ctx => ' ' + ₪(ctx.raw) }
        }
      }
    }
  });

  // Bar chart
  killChart('cats');
  const c2 = document.getElementById('ch-cats').getContext('2d');
  charts['cats'] = new Chart(c2, {
    type: 'bar',
    data: {
      labels: last6.map(mLabel),
      datasets: top5.map((cat,i) => ({
        label: (CM[cat]?.l||cat),
        data: last6.map(m => sumT(getMonthTxns(m).filter(t=>t.cat===cat))),
        backgroundColor: CHART_COLORS[i],
        borderRadius: 4,
        borderSkipped: false,
      }))
    },
    options: {
      ...chartDefaults(),
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: { color:'#7b8099', font:{family:'Heebo',size:11}, padding:12, boxWidth:12, boxHeight:12 }
        },
        tooltip: {
          backgroundColor: '#1a1f2e',
          borderColor: '#2a3050',
          borderWidth: 1,
          titleColor: '#e8eaf0',
          bodyColor: '#a8b0c8',
          callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + ₪(ctx.raw) }
        }
      },
      scales: {

// TAB 4 — SUBSCRIPTIONS (auto-detect)
// ══════════════════════════════════════════════════
function rSubscriptions() {
  const el = document.getElementById('t-subscriptions');

  // Auto-detect: merchants appearing in 3+ months
  const byName = {};
  for (const t of txns) {
    if (!byName[t.name]) byName[t.name] = [];
    byName[t.name].push(t);
  }

  const recurring = Object.entries(byName)
    .filter(([, list]) => {
      const ms = new Set(list.map(t=>t.month));
      return ms.size >= 3 && list[0].amount > 10; // appears in 3+ months, > 10₪
    })
    .map(([name, list]) => {
      const amounts = list.map(t=>t.amount).filter(a=>a>0);
      const avg = amounts.reduce((s,a)=>s+a,0) / amounts.length;
      const last = list.sort((a,b)=>b.date.localeCompare(a.date))[0];
      const anomaly = last.amount > avg * 1.15;
      return { name, avg, lastAmt: last.amount, lastDate: last.date, months: new Set(list.map(t=>t.month)).size, anomaly };
    })
    .sort((a,b) => b.avg - a.avg);

  // Enrich with icons
  const icons = {
    'HOT': '📡',
    'YES': '📺',
    'פרטנר': '📞',
    'אילי סנטר': '💪',
    'סנסיו': '💪',
    'APPLE': '🍎',
    'CLAUDE': '🤖',
    'CLAUDE.AI': '🤖',
    'SPOTIFY': '🎵',
    'NETFLIX': '🎬',
    'AMAZON': '📦',
    'GOOGLE': '🔍',
    'כללית': '🏥',
    'ארנונה': '🏙️',
    'מים': '💧',
  };
  function getIcon(name) {
    const nameUpper = name.toUpperCase();
    for (const [key, ico] of Object.entries(icons)) {
      if (nameUpper.includes(key.toUpperCase()) || name.includes(key)) return ico;
    }
    return '🔄';
  }

  const totalMonthly = recurring.reduce((s,r) => s+r.avg, 0);
  const annualTotal = totalMonthly * 12;

  const rowsHTML = recurring.map(r => `
    <div class="subrow">
      <div class="subleft">
        <div class="subicon">${getIcon(r.name)}</div>
        <div>
          <div class="subname">${r.name}</div>
          <div class="submeta">הופיע ב-${r.months} חודשים • עדכון אחרון: ${r.lastDate}</div>
          ${r.anomaly ? `<div class="subflag">⚠️ גבוה מהממוצע (${₪(r.lastAmt)} מול ${₪(r.avg)})</div>` : ''}
        </div>
      </div>
      <div class="subright">
        <div class="subamt">${₪(r.avg)}</div>
        <div class="subfreq">ממוצע/חודש</div>
      </div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="g2" style="margin-bottom:14px">
      <div class="card" style="margin:0;text-align:center">
        <div class="clabel">💸 סה"כ מנויים/חודש</div>
        <div class="cval" style="color:var(--red)">${₪(totalMonthly)}</div>
        <div class="csub">מזוהה אוטומטית</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div class="clabel">📅 עלות שנתית</div>
        <div class="cval" style="color:var(--red)">${₪(annualTotal)}</div>
        <div class="csub">${recurring.length} מנויים</div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">🔁 תשלומים חוזרים מזוהים</div>
      ${rowsHTML || '<div class="empty">לא זוהו מנויים</div>'}
    </div>

    <div class="card" style="background:rgba(0,200,117,.04);border-color:rgba(0,200,117,.2)">
      <div class="stitle" style="color:var(--green)">💡 חיסכון פוטנציאלי</div>
      <div style="font-size:13px;line-height:1.9;color:var(--text2)">
        <div>• <strong style="color:var(--text)">Bezeq במקום HOT</strong> — חיסכון ~<strong style="color:var(--green)">240₪/שנה</strong></div>
        <div>• <strong style="color:var(--text)">YES VOD (89₪) במקום YES (149₪)</strong> — חיסכון ~<strong style="color:var(--green)">720₪/שנה</strong></div>
        <div>• <strong style="color:var(--text)">ביטול כפל מנויי כושר</strong> — חיסכון ~<strong style="color:var(--green)">2,835₪/שנה</strong></div>
        <div style="margin-top:10px;padding:10px;background:rgba(0,200,117,.08);border-radius:10px;font-weight:800;color:var(--green);font-size:14px">
          🎯 סה"כ פוטנציאל: ~3,795₪/שנה
        </div>
      </div>
    </div>
  `;
}

  el.innerHTML = `
    <!-- Data status -->
    <div class="card" style="background:rgba(0,200,117,.05);border-color:rgba(0,200,117,.2);margin-bottom:14px">
      <div style="color:var(--green);font-weight:800;font-size:14px;margin-bottom:10px">✅ נתונים טעונים בהצלחה</div>

        אין שרת, אין ענן, אין שיתוף מידע. הכסף שלך נשאר בינך לבין עצמך. 🔐

}

function handleDrop(ev) {
  ev.preventDefault();
  document.getElementById('dropzone').classList.remove('drag');
  const file = ev.dataTransfer.files[0];
  if (file) showImportMsg(file.name);
}
function handleFile(inp) {
  if (inp.files[0]) showImportMsg(inp.files[0].name);
}
function showImportMsg(name) {
  alert(`📁 קובץ: ${name}\n\nתכונת הייבוא בפיתוח — בקרוב תוכל לייבא ישירות!\n\nבינתיים: המר לפורמט JSON ועדכן את data.json.`);
}
